[project]
name = "business-entity-resolution"
version = "0.1.0"
description = "ML Challenge 2026 — Business Entity Resolution pipeline"
readme = "README.md"
authors = [
    { name = "rishi-harti768", email = "rishie.harti@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "numpy>=2.5.3",
    "polars>=1.44.2",
    "rapidfuzz>=3.14.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[project.scripts]
business-entity-resolution = "business_entity_resolution.pipeline:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
